name: historyq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - historyq-postgres-data:/var/lib/postgresql/data
    networks: [historyq-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - historyq-silo-data:/data
    networks: [historyq-internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MINIO_URL: ${MINIO_URL}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL}
      OCR_API_TOKEN: ${OCR_API_TOKEN}
      OCR_CONNECT_TIMEOUT: ${OCR_CONNECT_TIMEOUT}
      OCR_READ_TIMEOUT: ${OCR_READ_TIMEOUT}
      OCR_JOB_TIMEOUT: ${OCR_JOB_TIMEOUT}
      OCR_JOB_POLL_INTERVAL: ${OCR_JOB_POLL_INTERVAL}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN}
    depends_on:
      postgres: {condition: service_healthy}
      silo: {condition: service_healthy}
    networks: [historyq-internal, historyq-ragflow]
    expose: ["8081"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    networks: [historyq-web]
    expose: ["80"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [historyq-web, historyq-internal]
    ports:
      - "${HISTORYQ_HTTP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  historyq-postgres-data:
  historyq-silo-data:

networks:
  historyq-internal:
    driver: bridge
    internal: true
  historyq-web:
    driver: bridge
  historyq-ragflow:
    name: historyq-ragflow
    external: true
