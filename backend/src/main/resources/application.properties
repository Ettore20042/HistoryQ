spring.application.name=orygenie-backend
server.port=8081

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

ragflow.base.url=${RAGFLOW_BASE_URL}
ragflow.api.key=${RAGFLOW_API_KEY}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

ocr.service.url=${OCR_SERVICE_URL}
ocr.service.token=${OCR_API_TOKEN}
ocr.service.connect-timeout=${OCR_CONNECT_TIMEOUT:10s}
ocr.service.read-timeout=${OCR_READ_TIMEOUT:30m}
ocr.job.timeout=${OCR_JOB_TIMEOUT:30m}
ocr.job.poll-interval=${OCR_JOB_POLL_INTERVAL:1s}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
