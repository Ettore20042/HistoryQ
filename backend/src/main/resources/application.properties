spring.application.name=orygenie-backend
server.port=8081

# RAGFlow Integration Properties
spring.config.import=optional:classpath:application-local.properties

ragflow.base.url=${RAGFLOW_BASE_URL:http://127.0.0.1:9380}

# Multipart configuration for document upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/historygenie
spring.datasource.username=historygenie
spring.datasource.password=historygenie

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

minio.url=http://localhost:9000
minio.access-key=rag_flow
minio.secret-key=infini_rag_flow
minio.bucket=historygenie-documents