spring.application.name=orygenie-backend
server.port=8081

# RAGFlow Integration Properties
ragflow.api.key=${RAGFLOW_API_KEY:}
ragflow.base.url=${RAGFLOW_BASE_URL:http://127.0.0.1:9380}
ragflow.dataset.id=${RAGFLOW_DATASET_ID:}
ragflow.chat.id=${RAGFLOW_CHAT_ID:}

# Multipart configuration for document upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/historygenie
spring.datasource.username=historygenie
spring.datasource.password=historygenie

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration